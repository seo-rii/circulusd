{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "circulusd.serviceAccountName" . }}
  labels:
    {{- include "circulusd.labels" . | nindent 4 }}
# The circulusd daemons never call the Kubernetes API; do not mount a token.
automountServiceAccountToken: {{ .Values.serviceAccount.automountToken }}
{{- end }}
