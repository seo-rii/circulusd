{{- include "circulusd.validateProfile" . -}}
{{- $sockDir := .Values.socketDir -}}
{{- $uid := .Values.runAsUser -}}
{{- $peer := .Values.controlPeerUID -}}
{{- $img := include "circulusd.image" . -}}
{{- $devProfile := eq .Values.profile "development-reference" -}}
{{- $cpSock := printf "%s/%s" $sockDir (ternary "platformd-dev.sock" "platformd.sock" $devProfile) -}}
{{- $agentdSock := printf "%s/agentd.sock" $sockDir -}}
{{- $executordSock := printf "%s/executord.sock" $sockDir -}}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "circulusd.fullname" . }}
  labels:
    {{- include "circulusd.labels" . | nindent 4 }}
  annotations:
    circulusd.dev/warning: >-
      Development/reference only. Not production; not a Kubernetes scheduler.
      Capabilities report NOT_WIRED and AdmissionReady stays false.
spec:
  selector:
    matchLabels:
      {{- include "circulusd.selectorLabels" . | nindent 6 }}
  updateStrategy:
    {{- toYaml .Values.updateStrategy | nindent 4 }}
  template:
    metadata:
      labels:
        {{- include "circulusd.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "circulusd.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountToken }}
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      hostNetwork: false
      terminationGracePeriodSeconds: 30
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
        runAsUser: {{ $uid }}
        runAsGroup: {{ .Values.runAsGroup }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        # Prepare the shared socket dir: an emptyDir is root-owned and
        # world-writable, but the daemons require their socket parent to be
        # owned by their UID with no group/other write bits. chmod first (root
        # owns the fresh dir, so no CAP_FOWNER), then chown (needs CAP_CHOWN).
        - name: socket-dir-init
          image: {{ $img | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/bin/sh", "-c"]
          args:
            - 'set -eu; chmod 0700 "$1"; chown "${2}:${3}" "$1"'
            - "circulusd"
            - {{ $sockDir | quote }}
            - {{ $uid | quote }}
            - {{ .Values.runAsGroup | quote }}
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            runAsNonRoot: false
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
              add: ["CHOWN"]
          volumeMounts:
            - name: run-pi-platform
              mountPath: {{ $sockDir | quote }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      containers:
        # --- Control plane -------------------------------------------------
        - name: platformd
          image: {{ $img | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # Remove a socket left by an ungraceful prior restart (the daemon
          # fail-closes on a pre-existing path), then exec so the daemon becomes
          # PID 1 and receives SIGTERM directly for graceful shutdown.
          command: ["/bin/sh", "-c"]
          {{- if $devProfile }}
          args:
            - 'set -eu; rm -f "$1"; exec /usr/local/bin/platformd-dev -listen "$3" -socket "$1" -allow-uid "$2"'
            - "circulusd"
            - {{ $cpSock | quote }}
            - {{ $uid | quote }}
            - {{ .Values.platformdDev.listen | quote }}
          {{- else }}
          args:
            - 'set -eu; rm -f "$1"; exec /usr/local/bin/platformd -socket "$1" -config "$2" -release-manifest "$3" -release-trust-roots "$4" -allow-uid "$5"'
            - "circulusd"
            - {{ $cpSock | quote }}
            - {{ .Values.production.configPath | quote }}
            - {{ .Values.production.releaseManifestPath | quote }}
            - {{ .Values.production.releaseTrustRootsPath | quote }}
            - {{ $uid | quote }}
          {{- end }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          startupProbe:
            exec:
              command: ["/usr/local/bin/platformctl", "capabilities", "-socket", {{ $cpSock | quote }}, "-timeout", "3s"]
            periodSeconds: 3
            failureThreshold: 10
            timeoutSeconds: 5
          readinessProbe:
            exec:
              command: ["/usr/local/bin/platformctl", "capabilities", "-socket", {{ $cpSock | quote }}, "-timeout", "3s"]
            initialDelaySeconds: 2
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command: ["/usr/local/bin/platformctl", "capabilities", "-socket", {{ $cpSock | quote }}, "-timeout", "3s"]
            initialDelaySeconds: 5
            periodSeconds: 20
            timeoutSeconds: 5
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: run-pi-platform
              mountPath: {{ $sockDir | quote }}
            {{- if not $devProfile }}
            {{- if .Values.production.filesSecretName }}
            - name: production-files
              mountPath: /etc/pi-platform
              readOnly: true
            {{- end }}
            {{- end }}
        {{- if .Values.daemons.agentd.enabled }}
        # --- agentd (workerd + cgroup domain; diagnostic-only here) --------
        - name: agentd
          image: {{ $img | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/bin/sh", "-c"]
          args:
            - 'set -eu; rm -f "$1"; s="$1"; p="$2"; shift 2; exec /usr/local/bin/agentd -socket "$s" -allow-platformd-uid "$p" -allow-platformctl-uid "$p" "$@"'
            - "circulusd"
            - {{ $agentdSock | quote }}
            - {{ $peer | quote }}
            {{- with .Values.daemons.agentd.extraArgs }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          readinessProbe:
            exec:
              command: ["/usr/local/bin/platformctl", "capabilities", "-socket", {{ $agentdSock | quote }}, "-timeout", "3s"]
            initialDelaySeconds: 2
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: run-pi-platform
              mountPath: {{ $sockDir | quote }}
            {{- if .Values.privilege.agentd.hostCgroup }}
            - name: host-cgroup
              mountPath: {{ .Values.privilege.agentd.hostCgroupPath | quote }}
            {{- end }}
        {{- end }}
        {{- if .Values.daemons.executord.enabled }}
        # --- executord (Docker/KVM/mount domain; diagnostic-only here) -----
        - name: executord
          image: {{ $img | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/bin/sh", "-c"]
          args:
            - 'set -eu; rm -f "$1"; s="$1"; p="$2"; shift 2; exec /usr/local/bin/executord -socket "$s" -allow-platformd-uid "$p" -allow-platformctl-uid "$p" "$@"'
            - "circulusd"
            - {{ $executordSock | quote }}
            - {{ $peer | quote }}
            {{- with .Values.daemons.executord.extraArgs }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
            {{- if .Values.privilege.executord.privileged }}
            privileged: true
            {{- end }}
          readinessProbe:
            exec:
              command: ["/usr/local/bin/platformctl", "capabilities", "-socket", {{ $executordSock | quote }}, "-timeout", "3s"]
            initialDelaySeconds: 2
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: run-pi-platform
              mountPath: {{ $sockDir | quote }}
            {{- if .Values.privilege.executord.dockerSocket }}
            - name: docker-socket
              mountPath: {{ .Values.privilege.executord.dockerSocketPath | quote }}
            {{- end }}
            {{- if .Values.privilege.executord.devKvm }}
            - name: dev-kvm
              mountPath: /dev/kvm
            {{- end }}
        {{- end }}
      volumes:
        - name: run-pi-platform
          emptyDir: {}
        {{- if and (not $devProfile) .Values.production.filesSecretName }}
        - name: production-files
          secret:
            secretName: {{ .Values.production.filesSecretName | quote }}
        {{- end }}
        {{- if and .Values.daemons.agentd.enabled .Values.privilege.agentd.hostCgroup }}
        - name: host-cgroup
          hostPath:
            path: {{ .Values.privilege.agentd.hostCgroupPath | quote }}
            type: Directory
        {{- end }}
        {{- if and .Values.daemons.executord.enabled .Values.privilege.executord.dockerSocket }}
        - name: docker-socket
          hostPath:
            path: {{ .Values.privilege.executord.dockerSocketPath | quote }}
            type: Socket
        {{- end }}
        {{- if and .Values.daemons.executord.enabled .Values.privilege.executord.devKvm }}
        - name: dev-kvm
          hostPath:
            path: /dev/kvm
            type: CharDevice
        {{- end }}
